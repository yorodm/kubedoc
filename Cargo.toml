[package]
name = "kubedoc"
version = "0.1.0"
edition = "2024"
description = "An agentic CLI tool for Kubernetes cluster diagnosis, performance review, and manifest generation"

[dependencies]
# Agent framework
rig-core = { version = "0.40.0", features = ["rmcp"] }

# Async runtime
tokio = { version = "1.53.1", features = ["full"] }

# Kubernetes API
kube = { version = "4.0.0", features = ["client", "config", "derive",  "runtime"] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }

# CLI
clap = { version = "4.6.3", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Configuration
toml = "1.1.3"

# HTTP client (MCP client, etc.)
reqwest = { version = "0.13.4", features = ["json"] }

# Tracing & audit
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }

# Utilities
uuid = { version = "1.24.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
glob = "0.3.1"
rmcp = { version = "1.7", features = ["client", "server", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest"] }
serde_yaml = "0.9"
thiserror = "2"

# TUI
ratatui = "0.30"
crossterm = "0.28"
